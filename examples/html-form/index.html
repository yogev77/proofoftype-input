<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comments typed by humans</title>
  <script src="https://www.proofoftype.com/sdk/v1.js" async></script>
</head>
<body>
  <h1>Leave a comment</h1>
  <!-- On submit the form posts `comment` (text) and `comment_proof` (token). -->
  <form method="post" action="/comments">
    <div data-proofoftype data-name="comment" data-placeholder="Write a comment" data-max-words="300"></div>
    <button type="submit">Post</button>
  </form>
</body>
</html>
